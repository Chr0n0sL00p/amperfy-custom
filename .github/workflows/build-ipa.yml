name: Build Amperfy Custom IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build and Archive
        run: |
          xcodebuild archive             -project Amperfy.xcodeproj             -scheme Amperfy             -configuration Release             -destination "generic/platform=iOS"             -archivePath build/Amperfy.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Amperfy.xcarchive/Products/Applications/Amperfy.app build/Payload/
          cd build
          zip -r -q Amperfy_Custom.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy_Custom_iOS
          path: build/Amperfy_Custom.ipa
